name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repo; release-please.yml holds the write grants.
permissions:
  contents: read

# Supersede in-flight runs for the same ref (but never cancel main pushes,
# so every landed commit keeps a complete CI record).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first so @oss-scout/mcp's typecheck, tests, and bundle resolve
      # @oss-scout/core through its published dist/ (the artifact consumers
      # actually get), not a stale or missing build (#149).
      - name: Build
        run: pnpm -r run build

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test with coverage
        run: pnpm -r run test:coverage

      - name: Bundle
        run: pnpm -r run bundle

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Blocking on production deps only: dev-tooling advisories (eslint,
      # vite chains) don't ship to users and shouldn't block releases.
      - name: Security audit
        run: pnpm audit --prod --audit-level=high
