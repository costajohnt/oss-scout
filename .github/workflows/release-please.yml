name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      core-released: ${{ steps.release.outputs['packages/core--release_created'] }}
      core-tag: ${{ steps.release.outputs['packages/core--tag_name'] }}
      mcp-released: ${{ steps.release.outputs['packages/mcp-server--release_created'] }}
      mcp-tag: ${{ steps.release.outputs['packages/mcp-server--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-core:
    name: Publish @oss-scout/core to npm
    needs: release-please
    if: needs.release-please.outputs.core-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.core-tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm trusted publishing (OIDC): the job's id-token mints the credential,
      # so no long-lived NPM_TOKEN is needed. The 1.7.0 publish failed with
      # `404 Not Found - PUT` on an expired granular token; the trusted
      # publisher for both packages is registered on npmjs.com (owner
      # costajohnt, repo oss-scout, this workflow file). Needs npm >= 11.5.1,
      # newer than Node 22's bundled npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Build and pack @oss-scout/core
        run: |
          pnpm --filter @oss-scout/core run prepublishOnly
          pnpm --filter @oss-scout/core pack --pack-destination "$RUNNER_TEMP/pkg-core"

      - name: Publish @oss-scout/core
        run: npm publish "$RUNNER_TEMP"/pkg-core/*.tgz --access public --provenance

  publish-mcp:
    name: Publish @oss-scout/mcp to npm
    needs: [release-please, publish-core]
    if: >-
      always()
      && !failure()
      && !cancelled()
      && needs.release-please.outputs.mcp-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.mcp-tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (required by mcp-server)
        run: pnpm --filter @oss-scout/core run build

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      # `pnpm pack` rewrites the `workspace:^` dependency on core to the
      # released version; `npm publish <tarball>` then needs no pnpm at all.
      - name: Build and pack @oss-scout/mcp
        run: |
          pnpm --filter @oss-scout/mcp run prepublishOnly
          pnpm --filter @oss-scout/mcp pack --pack-destination "$RUNNER_TEMP/pkg-mcp"

      - name: Publish @oss-scout/mcp
        run: npm publish "$RUNNER_TEMP"/pkg-mcp/*.tgz --access public --provenance
