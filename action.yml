name: "oss-scout digest"
description: "Run oss-scout search on a schedule and open/update a digest issue with the top candidates."
author: "John Costa"
branding:
  icon: "search"
  color: "purple"

inputs:
  github-username:
    description: "GitHub login to personalize search for. Defaults to the repository owner."
    required: false
    default: ${{ github.repository_owner }}
  search-token:
    description: >-
      Token used for bootstrap + search (reads your starred repos and PR
      history). A personal access token with repo read scope gives the best
      personalization; defaults to the workflow GITHUB_TOKEN, which only sees
      this repository.
    required: false
    default: ${{ github.token }}
  issue-token:
    description: "Token used to create/update the digest issue (needs issues: write). Defaults to GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}
  max-results:
    description: "Number of candidates to surface."
    required: false
    default: "10"
  strategy:
    description: "Search strategies (comma-separated): merged, starred, broad, maintained, all."
    required: false
    default: "all"
  issue-title:
    description: "Title of the digest issue."
    required: false
    default: "oss-scout digest"
  issue-label:
    description: "Label used to find and update the existing digest issue."
    required: false
    default: "oss-scout-digest"
  version:
    description: "Version of @oss-scout/core to run."
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: "20"

    # Inputs are passed through env and referenced as "$VAR" rather than
    # interpolated into the scripts, so a caller wiring event-derived data
    # (e.g. an issue title) into an input can't inject shell.
    - name: Bootstrap and search
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.search-token }}
        SCOUT_VERSION: ${{ inputs.version }}
        SCOUT_USERNAME: ${{ inputs.github-username }}
        SCOUT_MAX_RESULTS: ${{ inputs.max-results }}
        SCOUT_STRATEGY: ${{ inputs.strategy }}
      run: |
        set -euo pipefail
        PKG="@oss-scout/core@${SCOUT_VERSION}"
        npx -y "$PKG" config set githubUsername "$SCOUT_USERNAME"
        # Bootstrap is best-effort: a repo-scoped token may not see full history.
        npx -y "$PKG" bootstrap || echo "bootstrap skipped (limited token scope)"
        npx -y "$PKG" search "$SCOUT_MAX_RESULTS" --strategy "$SCOUT_STRATEGY" > /dev/null

    - name: Render digest
      shell: bash
      env:
        SCOUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        PKG="@oss-scout/core@${SCOUT_VERSION}"
        npx -y "$PKG" results --markdown > digest.md
        {
          echo ""
          echo "_Updated $(date -u '+%Y-%m-%d %H:%M UTC') by [oss-scout](https://github.com/costajohnt/oss-scout)._"
        } >> digest.md

    - name: Open or update the digest issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.issue-token }}
        GH_REPO: ${{ github.repository }}
        SCOUT_ISSUE_TITLE: ${{ inputs.issue-title }}
        SCOUT_ISSUE_LABEL: ${{ inputs.issue-label }}
      run: |
        set -euo pipefail
        # Ensure the label exists, tolerating only "already exists" — a
        # permission failure here would otherwise surface confusingly at the
        # gh issue step below.
        if ! create_err=$(gh label create "$SCOUT_ISSUE_LABEL" --color ededed \
          --description "oss-scout scheduled digest" 2>&1); then
          if ! grep -qi "already exists" <<<"$create_err"; then
            echo "$create_err" >&2
            exit 1
          fi
        fi

        existing=$(gh issue list --label "$SCOUT_ISSUE_LABEL" --state open \
          --json number --jq '.[0].number // empty')

        if [ -n "$existing" ]; then
          gh issue edit "$existing" --body-file digest.md
          echo "Updated digest issue #$existing"
        else
          gh issue create --title "$SCOUT_ISSUE_TITLE" \
            --label "$SCOUT_ISSUE_LABEL" --body-file digest.md
          echo "Created a new digest issue"
        fi
