packages:
  - 'packages/*'

onlyBuiltDependencies:
  - esbuild

# Security overrides for transitive CVEs. These live here, not in package.json
# `pnpm.overrides`, because pnpm v10 no longer reads the `pnpm` field ("The
# 'pnpm' field in package.json is no longer read by pnpm... keys ignored:
# pnpm.overrides"), which had silently deactivated the pins.
overrides:
  # Dev-only, transitive via packages/core -> vite. `server.fs.deny` bypass on
  # Windows alternate paths (high). Patched in 8.0.16.
  vite: '>=8.0.16'
  # Transitive via packages/mcp-server -> @modelcontextprotocol/sdk -> hono.
  # CORS wildcard-with-credentials reflection (4.12.25) plus five later
  # advisories, all patched by 4.12.34; 2026-09/10 advisories patched by 4.13.7.
  hono: '>=4.13.7'
  # Transitive via @modelcontextprotocol/sdk. Kept on the 1.x line the SDK
  # expects (forcing 2.x risks breaking its HTTP transports); the MCP server
  # is stdio-only and never loads the hono HTTP adapter (#311). The 1.x
  # advisory affecting <1.19.15 is patched in 1.19.15. Revisit on SDK bumps.
  '@hono/node-server': '^1.19.15'
  # Transitive via @modelcontextprotocol/sdk -> ajv. Path traversal, two
  # host-confusion advisories (GHSA-v2hh-gcrm-f6hx, GHSA-4c8g-83qw-93j6,
  # patched by 3.1.4), and the 4.x backslash-authority host confusion
  # (GHSA-7p8r-x3mc-p8w7, patched by 4.1.2), and the four 4.x host-confusion /
  # SSRF advisories (GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
  # GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp) patched by 4.1.3.
  fast-uri: '>=4.1.3'
  # Transitive via @modelcontextprotocol/sdk -> express-rate-limit. Leading-zero
  # octet decode mismatch enabling SSRF/trust-boundary bypass
  # (GHSA-mwp4-54f8-5fhr). Patched in 10.3.1; later advisories patched in 10.7.1.
  ip-address: '>=10.7.1'
  # Dev-only, transitive via eslint -> minimatch. ReDoS advisories, all
  # patched by 5.0.12.
  brace-expansion: '>=5.0.12'
  # Dev-only, transitive via vite -> postcss. Advisories patched in 8.5.23.
  postcss: '>=8.5.23'
  # Dev-only, transitive via postcss. Advisories patched in 3.3.18; kept on
  # the 3.x line postcss expects.
  nanoid: '^3.3.18'
  # Dev-only, transitive via @vitest/coverage-v8 -> magicast. Advisory
  # affects <1.2.2.
  source-map-js: '>=1.2.2'
  # Dev-only, transitive via eslint. Advisory affects <0.16.8.
  '@humanfs/node': '>=0.16.8'
